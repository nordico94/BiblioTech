<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <header>
        <h1>BiblioTech</h1>
        <h2>Catalogo y gestor de libros</h2>
    </header>


    <aside>
        <section class="agregado">
            <h2>Agregar libro</h2>


            <div class="formulario">
                <form action="">


                    <div class="entrada">
                        <label for="titulo">Titulo</label>
                        <input type='text' id="titulo" placeholder="Introducir titulo del libro">
                    </div>
                   
                    <div class="entrada">
                        <label for="autor">Autor</label>
                        <input type='text' id="autor" placeholder="Introducir autor del libro">
                    </div>
                   
                    <div class="entrada">
                        <label for="genero">Genero</label>
                        <input type='text' id="genero" placeholder="Introducir género del libro">
                    </div>
                   
                    <div class="entrada">
                        <label for="anio">Año</label>
                        <input type='number' id="anio" placeholder="Introducir año del libro">
                    </div>


                    <div class="entrada">
                        <button>Agregar</button>
                    </div>
                   
   
                   
                </form>
            </div>
        </section>


        <section class="busqueda">
            <h2>Buscar libros</h2>


            <div class="formulario">
                <form>


                    <div class="entrada">
                        <label for="opcion">Buscar por: </label>
                        <select id="opcion">
                            <option value="titulo">Titulo</option>
                            <option value="autor">Autor</option>    
                            <option value="genero">Genero</option>  
                            <option value="anio">Anio</option>
                        </select>
                    </div>


                    <div class="entrada">
                        <label for="busqueda">Busqueda</label>
                        <input type="text" id="busqueda" placeholder="Ingrese su busqueda">
                    </div>


                    <div class="entrada">
                        <button type="submit">Buscar</button>
                    </div>
                </form>
            </div>
        </section>




    </aside>


    <main>
        <section class="catalogo">
            <h2>Catalogo</h2>
            <div class="lista">


            </div>




        </section>
    </main>


    <footer>
        <h2>UTN - Mar del Plata</h2>
        <h2>2026</h2>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
